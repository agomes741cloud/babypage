.page {

    align-items: center;

.poster-shade {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.25) 0%,
            rgba(0,0,0,.45) 45%,
            rgba(0,0,0,.9) 100%
        );
}

.poster > div {
    position: relative;
    z-index: 1;
}

.poster-bg,
.poster-shade {
    position: absolute !important;
}

.original {
    color: #ddd;
    font-size: .8rem;
    letter-spacing: .08em;
}

.title {
    font-size: clamp(4rem, 18vw, 5rem);
    font-weight: 1000;
    letter-spacing: -.07em;
    line-height: .8;
    margin-top: 8px;
}

.meta {
    margin-top: 18px;
    color: #c6bdc7;
    line-height: 1.5;
}

.description {
    color: #aaa3ad;
    line-height: 1.6;
    max-width: 540px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
}

.play {
    background: white;
    color: #111;
}

.info {
    background: #29252d;
    color: white;
}

#reveal {
    display: none;
    text-align: center;
    padding: 35px 10px 10px;
}

#reveal.show {
    display: block;
    animation: reveal .7s cubic-bezier(.16,1,.3,1);
}

.baby-photo {
    width: 220px;
    height: 320px;
    border-radius: 14px;
    object-fit: cover;
    object-position: center 20%;
    border: 4px solid rgba(255,255,255,.85);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    margin: 0 auto;
    display: block;
}

.reveal-title {
    font-size: clamp(2.4rem, 10vw, 4rem);
    font-weight: 900;
    letter-spacing: -.05em;
    margin: 18px 0 10px;
}

.reveal-text {
    color: #bbb3bd;
    line-height: 1.6;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(.7) translateY(30px);
    }

    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    border-radius: 2px;
    z-index: 999;

    animation: fall 3s linear forwards;
}

@keyframes fall {

    0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media (max-width: 520px) {

    .page {
        padding: 16px;
    }

    .poster {
        border-radius: 20px;
        padding: 23px;
    }

    .baby-photo {
        width: 220px;
        height: 330px;
    }

}
</style>

<script>

function reveal() {

    document
        .getElementById("reveal")
        .classList
        .add("show");

    confetti();

    setTimeout(() => {

        document
            .getElementById("reveal")
            .scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

    }, 200);

}


function showInfo() {

    alert(
        "Sinopse:\n\n" +
        "Um homem sem experiência recebe " +
        "a missão mais importante da sua vida."
    );

}


function confetti() {

    const colors = [
        "#73e2a7",
        "#8ab4ff",
        "#ffd166",
        "#ff7b72",
        "#e9a6ff",
        "#ffffff"
    ];

    for (let i = 0; i < 70; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        piece.style.animationDelay =
            Math.random() * .8 + "s";

        piece.style.animationDuration =
            2 + Math.random() * 2 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 4500);

    }

}

</script>
